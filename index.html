<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Moving Multicolor Neon Gradient Title */
        .neon-title {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-align: center;
            background: linear-gradient(45deg, #ff0055, #00ffcc, #9900ff, #ffcc00, #ff0055);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonGradient 8s ease infinite;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.3));
        }

        @keyframes neonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            max-width: 450px;
        }

        /* Center-aligned vertical buttons */
        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a5c0;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            width: 100%;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1 class="neon-title">Hyperion</h1>

    <nav class="nav-group">
        <!-- Add your target URLs inside data-url -->
        <button class="tab-btn" data-url="https://wikipec.blogspot.com">Launch Portal One</button>
        <button class="tab-btn" data-url="https://tamilshowz.net">Launch Portal Two</button>
        <button class="tab-btn" data-url="https://wikipec.blogspot.com/2026/09/upd.html">Launch Portal Three</button>
        <button class="tab-btn" data-url="https://example.net">Launch Portal Four</button>
    </nav>

    <script>
        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', function() {
                const targetUrl = this.getAttribute('data-url');
                
                // Save URL locally so the next page can read it
                localStorage.setItem('selectedLink', targetUrl);
                
                // Open the 2nd page in the same app
                window.location.href = 'content.html';
            });
        });
    </script>

</body>
</html>
