<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0e15;
            color: #d1d5db;
            padding: 2rem;
            line-height: 1.7;
        }

        /* Fixed App Navigation Header */
        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn {
            background: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .back-btn:hover {
            background: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        /* Isolated Target Body Presentation Area */
        .body-content-area {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Styles to make the external body content look beautiful and clean */
        .body-content-area h1, .body-content-area h2 {
            color: #ffffff;
            margin: 1.5rem 0 1rem 0;
        }
        .body-content-area p {
            margin-bottom: 1.25rem;
        }

        .loader {
            color: #00ffcc;
            text-align: center;
            font-weight: 600;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    </header>

    <main class="body-content-area">
        <div id="loader" class="loader">Isolating body text...</div>
        <div id="clean-body-target"></div>
    </main>

    <script>
        async function loadIsolatedBody() {
            const url = localStorage.getItem('selectedLink');
            const targetDiv = document.getElementById('clean-body-target');
            const loader = document.getElementById('loader');

            if (!url) {
                loader.innerText = "No portal link selected.";
                return;
            }

            try {
                // Fetch direct safely because Capacitor ignores CORS locks
                const response = await fetch(url);
                if (!response.ok) throw new Error('Fetch failed');
                
                const htmlText = await response.text();
                
                // Parse text string into an actionable HTML document
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // STRIP EVERYTHING EXCEPT THE BODY: Delete scripts, navbars, menus, layouts
                const junkElements = doc.querySelectorAll('script, style, header, nav, footer, iframe, noscript');
                junkElements.forEach(el => el.remove());
                
                // Point image links back to the original host address so they load correctly inside the app
                const originUrl = new URL(url);
                doc.querySelectorAll('img').forEach(img => {
                    if (img.getAttribute('src') && !img.src.startsWith('http')) {
                        img.src = new URL(img.getAttribute('src'), originUrl.origin).href;
                    }
                });

                // Display only the core remaining body structure
                loader.style.display = 'none';
                targetDiv.innerHTML = doc.body.innerHTML || "<p>No body text available.</p>";

            } catch (error) {
                loader.style.display = 'none';
                targetDiv.innerHTML = `<p style="color:#ff0055;">Failed to separate body layout. Ensure connection is stable.</p>`;
            }
        }

        // Initialize script on page entry
        window.addEventListener('DOMContentLoaded', loadIsolatedBody);
    </script>

</body>
</html>
